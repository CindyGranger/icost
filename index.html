<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><meta name="app-version" content="3"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css?v=3"><title>账单整理器 v3</title></head>
<body><main class="app"><header><div class="eyebrow">WECHAT PAY · ICOST</div><h1>账单整理器</h1><p class="muted">每周整理一次，账单留在手机里处理</p></header>
<section id="importView" class="panel"><h2>导入微信账单</h2><p>选择微信支付导出的 CSV 或 XLSX。解析过程在此设备上完成。</p><label class="file"><input id="file" type="file" accept=".csv,.xlsx,.xlsm,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><span>选择账单文件</span></label><div id="fileName" class="muted small"></div><div class="row"><label class="toggle"><input id="useAI" type="checkbox" checked> 使用模型分类不明确的消费</label></div><button id="importBtn" class="primary" disabled>解析账单</button><details><summary>设置</summary><label>模型服务地址 <input id="apiUrl" value="/api/classify" placeholder="https://你的服务地址/api/classify"></label><label>iCost 账户 <input id="account" value="微信支付"></label><p class="small muted">默认使用当前网站的模型服务。请在自建服务端配置 API 密钥，切勿把密钥填在这里。</p></details></section>
<section id="summaryView" class="panel hidden"></section><section id="reviewView" class="panel hidden"></section><section id="exportView" class="panel hidden"></section><footer>本地优先 · 不保存历史分类规则</footer></main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="/app.js?v=3"></script></body></html>
